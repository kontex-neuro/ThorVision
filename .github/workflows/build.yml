name: Publish ThorVision

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.2.1 or dev-v1.2.1"
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'
      - 'dev-v*.*.*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/desktop-installers.yml
    secrets: inherit

  github-release:
    needs: build
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve tag ref
        id: tag_ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_REF="${{ github.event.inputs.tag }}"
          else
            TAG_REF="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG_REF" >> "$GITHUB_OUTPUT"
          echo "TAG_REF=$TAG_REF" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag_ref.outputs.tag }}
          fetch-depth: 0

      - name: Extract changelog
        shell: bash
        run: |
          VERSION="${TAG_REF#v}"
          BODY=$(awk \
            "/^## \[v${VERSION//./\\.}\]/{found=1; next} \
             found && /^## /{exit} \
             found{print}" \
            docs/CHANGELOG.md)

          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "Error: No changelog entry for v${VERSION} in docs/CHANGELOG.md."
            exit 1
          fi

          printf '%s\n' "$BODY" > "${RUNNER_TEMP}/release_notes.md"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file "${RUNNER_TEMP}/release_notes.md" \
            --verify-tag
