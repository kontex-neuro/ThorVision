name: macOS

on:
  workflow_dispatch:

jobs:
  macos:
    strategy:
      matrix:
        os_arch: 
          [
            { os: macos-15, arch: arm64 },
            # { os: macos-15, arch: x64 },
          ]

    runs-on: ${{ matrix.os_arch.os }}

    env:
      OS_ARCH: ${{ matrix.os_arch.os }}-${{ matrix.os_arch.arch }}

    steps:
      - name: Install build tools
        run: |
          pip install cmake conan ninja
      
      - name: Setup Compiler
        run: |
          echo "CC=$(brew --prefix llvm@18)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm@18)/bin/clang++" >> $GITHUB_ENV

      - name: Conan cache
        id: conan_cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ env.OS_ARCH }}-conan
          restore-keys: |
            ${{ env.OS_ARCH }}-conan
      
      # - name: Set homebrew cache path
      #   run: |
      #     if [[ "${{ matrix.os_arch.arch }}" == "arm64" ]]; then
      #       echo "BREW_CACHE_PATH=/opt/homebrew" >> $GITHUB_ENV
      #     fi
      #     # elif [[ "${{ matrix.arch }}" == "x86_64" ]]; then
      #     #   echo "BREW_CACHE_PATH=/usr/local/homebrew" >> $GITHUB_ENV

      # - name: Homebrew cache
      #   id: brew_cache
      #   uses: actions/cache@v4
      #   with:
      #     path: ${{ env.BREW_CACHE_PATH }}
      #     key: ${{ env.OS_ARCH }}-brew
      #     restore-keys: |
      #       ${{ env.OS_ARCH }}-brew

      - name: Clone
        uses: actions/checkout@v4

      - name: Conan setup
        run: conan config install .github/conan_profiles/${{ env.OS_ARCH }} -tf profiles

      - name: Install GStreamer
        run: |
          brew install --cask gstreamer-development

      - name: Set GStreamer Environment Variables
        run: |
          echo "PKG_CONFIG_PATH=/Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig" >> $GITHUB_ENV
          echo "/Library/Frameworks/GStreamer.framework/Versions/1.0/bin" >> $GITHUB_PATH
    
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }} # xdaqmetadata

      - name: Add GitHub to the SSH known hosts file
        run: ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Clone xdaqmetadata
        run: git clone git@github.com:kontex-neuro/xdaqmetadata.git

      - name: Install xdaqmetadata
        working-directory: xdaqmetadata
        run: |
          conan install . -b missing -pr:a ${{ env.OS_ARCH }} -s build_type=Release
          cmake -S . -B build/Release --preset conan-release -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Release
          conan export-pkg . -pr:a ${{ env.OS_ARCH }} -s build_type=Release

      - name: Clone libxvc
        run: git clone git@github.com:kontex-neuro/libxvc.git

      - name: Install libxvc
        working-directory: libxvc
        run: |
          conan install . -b missing -pr:a ${{ env.OS_ARCH }} -s build_type=Release
          cmake -S . -B build/Release --preset conan-release -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Release
          conan export-pkg . -pr:a ${{ env.OS_ARCH }} -s build_type=Release

      - name: Install Qt
        uses: jdpurcell/install-qt-action@v5
        with:
          version: '6.8.*'
          cache: true
          dir: ${{ github.workspace }}

      - name: Build the app
        run: |
          # export PKG_CONFIG_PATH=/Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig
          conan install . --build=missing -pr:a ${{ env.OS_ARCH }} -s build_type=Release
          cmake -S . -B build/Release --preset conan-release -G "Ninja" -DCMAKE_INSTALL_PREFIX="." -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Release

      - name: Deploy the app
        run: |
          cmake --build build/Release --target install
          cmake --build build/Release --target package

      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PWD: ${{ secrets.PWD }}
        run: |
          xcrun notarytool store-credentials "kontex" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PWD"
          xcrun notarytool submit build/Release/ThorVision-0.0.3-Darwin.dmg --keychain-profile "kontex" --wait
          xcrun stapler staple build/Release/ThorVision-0.0.3-Darwin.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS_ARCH }}
          path: build/Release/ThorVision-0.0.3-Darwin.dmg
